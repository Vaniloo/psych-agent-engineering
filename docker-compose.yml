x-runtime-dependencies: &runtime-dependencies
  BACKEND_BASE_URL: http://backend:8080
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-replace-with-an-independent-random-service-token}
  REDIS_URL: redis://redis:6379/0
  CHROMA_HOST: http://chroma
  CHROMA_PORT: 8000
  CHROMA_COLLECTION: psych-agent-knowledge-v2
  OLLAMA_BASE_URL: http://ollama:11434
  OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3.5:4b}
  AI_PROVIDER: ${AI_PROVIDER:-ollama}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
  OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
  OLLAMA_THINK: ${OLLAMA_THINK:-false}
  MEMORY_PROVIDER: ${MEMORY_PROVIDER:-rules}
  MEMORY_BASE_URL: ${MEMORY_BASE_URL:-http://laya-memory:8092}
  MEMORY_API_KEY: ${MEMORY_API_KEY:-}
  MEMORY_STORE_PATH: /data/memory.sqlite3
  MEMORY_CONTRACT_VERSION: ${MEMORY_CONTRACT_VERSION:-psych-memory-v2}
  MEMORY_MIN_PROBABILITY: ${MEMORY_MIN_PROBABILITY:-0.85}
  MEMORY_RERANK_BASE_URL: ${MEMORY_RERANK_BASE_URL:-}
  MEMORY_RERANK_API_KEY: ${MEMORY_RERANK_API_KEY:-}
  MEMORY_RERANK_TIMEOUT_SECONDS: ${MEMORY_RERANK_TIMEOUT_SECONDS:-2}
  MEMORY_RECALL_RECENT_LIMIT: ${MEMORY_RECALL_RECENT_LIMIT:-24}
  MEMORY_QUERY_TIMEZONE: ${MEMORY_QUERY_TIMEZONE:-Asia/Shanghai}
  MEMORY_LEGACY_TIMEZONE: ${MEMORY_LEGACY_TIMEZONE:-UTC}

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-psych_agent}
      MYSQL_USER: ${MYSQL_USERNAME:-psych_agent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-password}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-change-root-password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis/redis-stack-server:latest
    environment:
      REDIS_ARGS: "--appendonly yes"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chroma:
    image: chromadb/chroma:latest
    volumes:
      - chroma-data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/8000"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: "ollama pull ${OLLAMA_CHAT_MODEL:-qwen3.5:4b} && ollama pull ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}"
    restart: "no"

  mcp-server:
    build: ./agent-runtime
    command: ["python", "-m", "psych_agent_runtime.mcp_server"]
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    environment:
      SERVICE_NAME: psych-agent-mcp
      <<: *runtime-dependencies
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8001
    volumes:
      - memory-index:/data
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8001), 3).close()"]
      interval: 5s
      timeout: 4s
      retries: 20

  agent-runtime:
    build: ./agent-runtime
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      mcp-server:
        condition: service_healthy
    environment:
      <<: *runtime-dependencies
      SERVICE_NAME: psych-agent-runtime
      MCP_SERVER_URL: http://mcp-server:8001/mcp
      ROUTER_PROVIDER: ${ROUTER_PROVIDER:-rules}
      ROUTER_BASE_URL: ${ROUTER_BASE_URL:-http://laya-router:8091}
      ROUTER_API_KEY: ${ROUTER_API_KEY:-}
      ROUTER_TIMEOUT_SECONDS: ${ROUTER_TIMEOUT_SECONDS:-3}
      ROUTER_MIN_PROBABILITY: ${ROUTER_MIN_PROBABILITY:-0.85}
      EXECUTOR_PROVIDER: ${EXECUTOR_PROVIDER:-rules}
      EXECUTOR_BASE_URL: ${EXECUTOR_BASE_URL:-http://laya-executor:8093}
      EXECUTOR_API_KEY: ${EXECUTOR_API_KEY:-}
      EXECUTOR_MIN_PROBABILITY: ${EXECUTOR_MIN_PROBABILITY:-0.85}
      TOOL_TRANSPORT: ${TOOL_TRANSPORT:-local}
      CHECKPOINT_BACKEND: redis
      MODEL_COST_MODE: ${MODEL_COST_MODE:-local}
      INPUT_COST_PER_MILLION_TOKENS: ${INPUT_COST_PER_MILLION_TOKENS:-0}
      OUTPUT_COST_PER_MILLION_TOKENS: ${OUTPUT_COST_PER_MILLION_TOKENS:-0}
      CONTEXT_WINDOW_TOKENS: ${CONTEXT_WINDOW_TOKENS:-8192}
      RESPONSE_RESERVE_TOKENS: ${RESPONSE_RESERVE_TOKENS:-1200}
      RAG_LLM_RERANK_ENABLED: ${RAG_LLM_RERANK_ENABLED:-false}
      EXECUTOR_GOAL_PROVIDER: ${EXECUTOR_GOAL_PROVIDER:-}
      EXECUTOR_GOAL_BASE_URL: ${EXECUTOR_GOAL_BASE_URL:-}
      EXECUTOR_GOAL_API_KEY: ${EXECUTOR_GOAL_API_KEY:-}
      EXECUTOR_GOAL_TIMEOUT_SECONDS: ${EXECUTOR_GOAL_TIMEOUT_SECONDS:-2}
      EXECUTOR_GOAL_MIN_PROBABILITY: ${EXECUTOR_GOAL_MIN_PROBABILITY:-0.85}
      AGENT_LOOP_TIMEOUT_SECONDS: ${AGENT_LOOP_TIMEOUT_SECONDS:-35}
      AGENT_LOOP_REFINEMENT_ENABLED: ${AGENT_LOOP_REFINEMENT_ENABLED:-true}
      MEMORY_CONTEXT_RECALL_ENABLED: ${MEMORY_CONTEXT_RECALL_ENABLED:-true}
      MEMORY_LIFECYCLE_SHADOW_URL: ${MEMORY_LIFECYCLE_SHADOW_URL:-}
      MEMORY_LIFECYCLE_SHADOW_KEY: ${MEMORY_LIFECYCLE_SHADOW_KEY:-}
      MEMORY_LIFECYCLE_SHADOW_USERS: ${MEMORY_LIFECYCLE_SHADOW_USERS:-}
      MEMORY_LIFECYCLE_SANDBOX_USERS: ${MEMORY_LIFECYCLE_SANDBOX_USERS:-}
      MEMORY_LIFECYCLE_STORE_PATH: /data/memory-lifecycle.sqlite3
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - memory-index:/data
    expose:
      - "8090"

  backend:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      agent-runtime:
        condition: service_healthy
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-psych_agent}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      MYSQL_USERNAME: ${MYSQL_USERNAME:-psych_agent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      REDIS_HOST: redis
      CHROMA_HOST: http://chroma
      CHROMA_PORT: 8000
      LEGACY_CHROMA_COLLECTION: psych-agent-knowledge-legacy
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3.5:4b}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      AGENT_RUNTIME_URL: http://agent-runtime:8090
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-replace-with-an-independent-random-service-token}
      AGENT_STREAM_CONCURRENCY: ${AGENT_STREAM_CONCURRENCY:-4}
      AGENT_STREAM_QUEUE_CAPACITY: ${AGENT_STREAM_QUEUE_CAPACITY:-4}
      JWT_SECRET: ${JWT_SECRET:-replace-with-at-least-32-random-characters}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  memory-index:
  mysql-data:
  redis-data:
  chroma-data:
  ollama-data:
