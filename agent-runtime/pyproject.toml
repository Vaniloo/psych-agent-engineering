[project]
name = "psych-agent-runtime"
version = "0.1.0"
description = "LangGraph runtime, hybrid RAG, SSE streaming, and MCP tools for Psych Agent"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.12,<4",
  "chromadb>=1.0,<2",
  "fastapi>=0.115,<1",
  "httpx[socks]>=0.28,<1",
  "langgraph>=1.1,<2",
  "langgraph-checkpoint-redis>=0.1,<1",
  "mcp[cli]>=1.10,<2",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.10,<3",
  "redis>=5.2,<7",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
executor = [
  "peft==0.17.1",
  "transformers==4.57.6",
  "torch>=2.7,<3",
]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["psych_agent_runtime"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
