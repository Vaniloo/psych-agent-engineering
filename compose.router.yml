# docker compose -f docker-compose.yml -f compose.router.yml --profile routing up --build
services:
  decision-router:
    profiles: [routing]
    build:
      context: ./agent-runtime
      dockerfile: Dockerfile.router
    environment:
      ROUTER_HOST: 0.0.0.0
      ROUTER_CHECKPOINT: /checkpoint
      ROUTER_DEVICE: cpu
      ROUTER_API_KEY: ${ROUTER_API_KEY:?Set a router service token}
      HF_HOME: /cache/huggingface
      XDG_CACHE_HOME: /cache/xdg
    volumes:
      - ${ROUTER_CHECKPOINT:?Set the checkpoint directory}:/checkpoint:ro
      - router-cache:/cache
    expose:
      - "8091"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8091/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
volumes:
  router-cache:
